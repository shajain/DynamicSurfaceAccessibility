[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dsa"
version = "0.1.0"
description = "Tools and notebooks for dynamic solvent accessibility analysis"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "biopython",
    "numpy",
    "gemmi",
    "freesasa",
    "zstandard",
    "requests",
    "matplotlib",
    "matplotlib-venn",
    "typing_extensions",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
